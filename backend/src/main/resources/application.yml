spring:
  application:
    name: finishers-backend
  config:
    import: optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${FPA_DB_URL}
    username: ${FPA_DB_USER}
    password: ${FPA_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: app
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    clean-disabled: true
  threads:
    virtual:
      enabled: true
server:
  port: ${FPA_SERVER_PORT:8080}
  address: ${FPA_SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
